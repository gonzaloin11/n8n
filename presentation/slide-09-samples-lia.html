<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Samples - LÍA Agente IA</title>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    @font-face {
      font-family: 'Neue Machina';
      src: url("https://www.genspark.ai/image_placeholder.png") format('woff2');
      font-weight: 700;
      font-style: normal;
    }

    body{
      font-family: 'Roboto Mono', monospace;
      background-color:#0F0F0F;
      color:#DDDDDD;
      margin:0;
      padding:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .container{
      width:1280px;
      height:720px;
      margin:0 auto;
      padding:24px 40px;
      display:flex;
      flex-direction:column;
      box-sizing:border-box;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
    }

    .logo{
      display:flex;
      align-items:center;
      color:#CBF400;
      font-weight:600;
      font-size:14px;
      letter-spacing:0.5px;
    }

    .logo i{
      margin-right:10px;
      font-size:16px;
    }

    .date{
      color:#CBF400;
      font-size:14px;
    }

    .title-row{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      margin-bottom:16px;
    }

    .main-title{
      font-family:'Neue Machina', sans-serif;
      color:#CBF400;
      font-size:56px;
      font-weight:700;
      margin:0;
      line-height:1;
      letter-spacing:-1px;
    }

    .subtitle{
      color:#CBF400;
      font-size:12px;
      max-width:420px;
      text-align:right;
      line-height:1.4;
      opacity:0.9;
    }

    .samples-grid{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:16px;
      flex:1;
      min-height:0;
    }

    .sample-card{
      background-color:rgba(203,244,0,0.03);
      border:2px solid #CBF400;
      border-radius:4px;
      padding:10px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .card-label{
      font-size:10px;
      color:#CBF400;
      text-transform:uppercase;
      letter-spacing:1px;
      margin-bottom:8px;
      font-weight:600;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .card-image{
      flex:1;
      border-radius:4px;
      overflow:hidden;
      background-color:#0b141a;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card-image img{
      width:100%;
      height:100%;
      object-fit:contain;
      border-radius:4px;
    }

    .footer-note{
      margin-top:12px;
      padding:10px 16px;
      background-color:#CBF400;
      color:#0F0F0F;
      font-size:12px;
      display:flex;
      align-items:center;
      gap:10px;
      border-radius:2px;
    }

    .footer-note i{
      font-size:16px;
    }

    .footer-note strong{
      font-weight:700;
    }
  </style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">
<i class="fas fa-robot"></i>
<p style="margin:0;">LÍA • AGENTE IA</p>
</div>
<div class="date">
<p style="margin:0;">Samples 2026</p>
</div>
</div>

<div class="title-row">
<h1 class="main-title">Samples</h1>
<p class="subtitle">Conversaciones reales del agente IA en WhatsApp con integración MercadoLibre.</p>
</div>

<div class="samples-grid">
<!-- Sample 1: Product Links -->
<div class="sample-card">
<div class="card-label"><i class="fas fa-shopping-cart"></i> Recomendación + Links</div>
<div class="card-image">
<img src="https://raw.githubusercontent.com/gonzaloin11/n8n/claude/create-presentation-slides-IFes4/presentation/wapp%20vitagel%20sample%201.png" alt="WhatsApp - Recomendación de productos con links"/>
</div>
</div>

<!-- Sample 2: Quick Response -->
<div class="sample-card">
<div class="card-label"><i class="fas fa-bolt"></i> Consulta Rápida</div>
<div class="card-image">
<img src="https://raw.githubusercontent.com/gonzaloin11/n8n/claude/create-presentation-slides-IFes4/presentation/wapp%20vitagel%20sample%202.png" alt="WhatsApp - Consulta rápida"/>
</div>
</div>

<!-- Sample 3: Health + Audio -->
<div class="sample-card">
<div class="card-label"><i class="fas fa-heartbeat"></i> Consulta Salud + Audio</div>
<div class="card-image">
<img src="https://raw.githubusercontent.com/gonzaloin11/n8n/claude/create-presentation-slides-IFes4/presentation/wapp%20vitagel%20sample%204full.png" alt="WhatsApp - Consulta de salud con audio"/>
</div>
</div>
</div>

<div class="footer-note">
<i class="fa-brands fa-whatsapp"></i>
<p style="margin:0;"><strong>Conversaciones reales.</strong> Agente IA integrado con WhatsApp + MercadoLibre API para atención automatizada 24/7.</p>
</div>
</div>
</body>
</html>
